rch-input{padding-left:43px;border-radius:25px;border:1px solid var(--line);background:#fff;min-height:44px}.nav-pills .nav-link{border-radius:14px;font-weight:700;color:#657263;background:#f2f5ef;border:1px solid transparent}.nav-pills .nav-link.active{background:var(--green);color:#fff;box-shadow:0 5px 14px rgba(49,87,53,.18)}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 6px 20px rgba(49,87,53,.05);transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(49,87,53,.10)}.card-img-top{height:220px;object-fit:cover;background:#f2f2ec}.card-title{color:var(--green)}.price{color:var(--green2);font-size:1.02rem}.btn-shop{background:var(--green);border-color:var(--green);color:#fff;border-radius:999px}.btn-shop:hover,.btn-shop:focus{background:#27472b;border-color:#27472b;color:#fff}.btn-outline-shop{border-color:#9caf99;color:var(--green);border-radius:999px}.btn-outline-shop:hover{background:#edf3ea;border-color:#8fa58b;color:var(--green)}.product-actions{display:flex;gap:8px}.product-actions .btn{flex:1}.admin-delete{flex:0 0 auto!important;width:42px;padding:0}.custom-ribbon{position:absolute;top:10px;left:10px;background:#e8f0e5;color:var(--green);border:1px solid #cbdac8;border-radius:999px;padding:4px 9px;font-size:.7rem;font-weight:700}.support-banner{background:#f0f5ed;border:1px dashed #aabda7;border-radius:17px;padding:15px}.cart-sticky-bar{position:fixed;left:0;right:0;bottom:0;z-index:1040;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(49,87,53,.08);padding:10px 16px calc(10px + var(--safe-bottom))}.modal-content{border:1px solid var(--line);border-radius:20px;overflow:hidden}.modal-header{background:#f5f7f1}.qty-btn{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:9px}.empty-state{border-radius:16px;background:#fff;padding:35px 15px;color:# /* ===== FAMILY SHOP: PHONE MODE ===== */
@media (max-width: 600px) {
  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden !important;
  }

  body {
    padding-bottom: 76px !important;
  }

  .container, .container-fluid, main, .shop-container, .content {
    width: 100% !important;
    max-width: 100% !important;
    padding-left: 10px !important;
    padding-right: 10px !important;
  }

  header {
    padding: 10px !important;
  }

  header .brand-name {
    font-size: 24px !important;
  }

  header .brand-sub {
    font-size: 8px !important;
    letter-spacing: 3px !important;
  }

  header img {
    max-width: 100% !important;
    height: auto !important;
  }

  /* Hide desktop sidebars; open their content as mobile modals/dropdowns. */
  .sidebar, .right-sidebar, .desktop-sidebar {
    display: none !important;
  }

  .hero, .banner, .hero-banner {
    min-height: 170px !important;
    height: auto !important;
    border-radius: 14px !important;
    overflow: hidden !important;
  }

  .hero img, .banner img, .hero-banner img {
    width: 100% !important;
    height: auto !important;
    object-fit: cover !important;
  }

  .categories, .category-list {
    display: flex !important;
    gap: 7px !important;
    overflow-x: auto !important;
    flex-wrap: nowrap !important;
    padding: 4px 1px 8px !important;
    scrollbar-width: none;
  }

  .categories::-webkit-scrollbar, .category-list::-webkit-scrollbar {
    display: none;
  }

  .categories > *, .category-list > * {
    flex: 0 0 auto !important;
    white-space: nowrap !important;
  }

  .products-grid, .row.products, .product-grid {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 9px !important;
    margin: 0 !important;
  }

  .products-grid > *, .row.products > *, .product-grid > * {
    width: auto !important;
    max-width: none !important;
    padding: 0 !important;
  }

  .card {
    min-width: 0 !important;
    border-radius: 13px !important;
    overflow: hidden !important;
  }

  .card img, .card-img-top {
    width: 100% !important;
    height: 145px !important;
    object-fit: cover !important;
  }

  .card-body {
    padding: 9px !important;
  }

  .card-title {
    font-size: 14px !important;
    line-height: 1.15 !important;
  }

  .price {
    font-size: 15px !important;
  }

  .product-actions {
    gap: 5px !important;
  }

  .product-actions .btn {
    width: 100% !important;
    font-size: 12px !important;
    padding: 8px 5px !important;
  }

  /* Cart/support/admin windows must fit inside the phone viewport. */
  .modal-dialog {
    width: calc(100% - 20px) !important;
    max-width: calc(100% - 20px) !important;
    margin: 10px auto !important;
  }

  .modal-content {
    max-width: 100% !important;
    max-height: calc(100dvh - 20px) !important;
    overflow: auto !important;
    border-radius: 16px !important;
  }

  .offcanvas, .dropdown-menu, .support-menu {
    max-width: calc(100vw - 20px) !important;
  }

  .dropdown-menu {
    width: 250px !important;
  }

  /* Bottom navigation like a mobile shopping app. */
  .bottom-nav, nav.fixed-bottom {
    position: fixed !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    z-index: 1050 !important;
    width: 100% !important;
  }

  input, select, textarea, button {
    max-width: 100% !important;
  }
}


/* ===== TELEGRAM PHONE MODE — COMPACT 360/390px ===== */
@media (max-width: 600px){
  html{width:100vw!important;max-width:100vw!important;overflow-x:hidden!important}
  body{width:100vw!important;max-width:100vw!important;min-width:0!important;overflow-x:hidden!important;font-size:13px!important;padding-bottom:68px!important}
  .brand-header{position:sticky!important;top:0!important;z-index:1100!important}
  .brand-wrap{min-height:54px!important;padding:6px 8px!important}
  .brand-logo{width:38px!important;height:38px!important}
  .brand-name{font-size:15px!important;line-height:1!important}
  .brand-sub{display:none!important}
  .brand-wrap .btn{font-size:11px!important;padding:7px 9px!important}
  .hero{padding:10px 8px 12px!important;margin:0!important;border-radius:0 0 14px 14px!important}
  .hero-logo{width:64px!important;height:64px!important;border-width:2px!important}
  .hero h1{font-size:1.05rem!important;margin:5px 0 2px!important}
  .hero p{font-size:.68rem!important}
  .hero:before,.hero:after{font-size:28px!important}
  .content-card{padding:8px!important;border-radius:12px!important}
  .search-input{min-height:38px!important;font-size:13px!important}
  .nav-pills{gap:5px!important;overflow-x:auto!important;flex-wrap:nowrap!important;padding-bottom:3px!important}
  .nav-pills .nav-item{flex:0 0 auto!important}
  .nav-pills .nav-link{font-size:11px!important;padding:7px 9px!important;border-radius:10px!important;white-space:nowrap!important}
  .card{border-radius:10px!important;box-shadow:0 2px 9px rgba(49,87,53,.06)!important}
  .card-img-top,.card img{height:105px!important;min-height:105px!important;max-height:105px!important}
  .card-body{padding:6px!important}
  .card-title{font-size:11px!important;line-height:1.12!important;margin-bottom:3px!important}
  .small-muted{font-size:9px!important;line-height:1.15!important}
  .price{font-size:11px!important;margin-bottom:5px!important}
  .product-actions{gap:3px!important}
  .product-actions .btn{font-size:9px!important;padding:5px 3px!important;line-height:1.05!important}
  .admin-delete{width:28px!important}
  .custom-ribbon{top:5px!important;left:5px!important;font-size:7px!important;padding:2px 5px!important}
  .cart-sticky-bar{padding:7px 8px calc(7px + var(--safe-bottom))!important}
  .cart-sticky-bar .btn{font-size:11px!important;padding:7px 10px!important}
  .support-banner{padding:8px!important;border-radius:11px!important}
  .support-banner strong{font-size:11px!important}
  .support-banner p,.support-banner .btn{font-size:10px!important}
  .modal{--bs-modal-width:calc(100vw - 16px)!important}
  .modal-dialog{width:calc(100vw - 16px)!important;max-width:calc(100vw - 16px)!important;margin:8px auto!important}
  .modal-dialog-scrollable{height:calc(100dvh - 16px)!important;max-height:calc(100dvh - 16px)!important}
  .modal-content{width:100%!important;max-width:100%!important;max-height:calc(100dvh - 16px)!important;border-radius:14px!important;overflow:hidden!important}
  .modal-header,.modal-body,.modal-footer{padding:9px!important}
  .modal-title{font-size:14px!important}
  .modal-body{font-size:12px!important;overflow-y:auto!important;overflow-x:hidden!important}
  .modal-footer .btn{font-size:11px!important;padding:6px 10px!important}
  #adminModal .modal-dialog{width:calc(100vw - 12px)!important;max-width:calc(100vw - 12px)!important;margin:6px auto!important}
  #adminModal .modal-content{max-height:calc(100dvh - 12px)!important}
  #adminModal .modal-body{padding:8px!important}
  #adminModal .admin-product-row{padding:7px!important;border-radius:10px!important}
  #loginModal .modal-dialog{width:calc(100vw - 28px)!important;max-width:calc(100vw - 28px)!important}
  #loginModal .input-group,#loginModal .modal-footer{display:none!important}
  #loginModal .modal-body{padding:12px!important}
  .container,.container-fluid{width:100%!important;max-width:100%!important;padding-left:7px!important;padding-right:7px!important}
  .row{--bs-gutter-x:.4rem!important;--bs-gutter-y:.4rem!important}
  .col,.row>*{min-width:0!important}
  input,select,textarea,button{max-width:100%!important}
}
@media (min-width:601px){.telegram-phone-only{display:none!important}}

</style>
